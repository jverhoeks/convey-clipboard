name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        env:
          REF: ${{ github.ref_name }}
        run: |
          echo "tag=$REF" >> "$GITHUB_OUTPUT"
          echo "value=${REF#v}" >> "$GITHUB_OUTPUT"

      - name: Stamp version into the build
        env:
          VALUE: ${{ steps.version.outputs.value }}
        run: |
          printf 'public let conveyVersion = "%s"\n' "$VALUE" > Sources/ConveyCore/Version.swift

      - name: Build universal release
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Locate products
        id: bin
        run: echo "dir=$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)" >> "$GITHUB_OUTPUT"

      - name: Verify embedded version
        env:
          VALUE: ${{ steps.version.outputs.value }}
          BIN: ${{ steps.bin.outputs.dir }}
        run: |
          got="$("$BIN/convey" version)"
          echo "convey version -> $got"
          test "$got" = "$VALUE"

      - name: Verify universal binaries
        env:
          BIN: ${{ steps.bin.outputs.dir }}
        run: |
          file "$BIN/convey" "$BIN/convey-app"
          lipo -info "$BIN/convey"

      - name: Package
        id: pkg
        env:
          TAG: ${{ steps.version.outputs.tag }}
          BIN: ${{ steps.bin.outputs.dir }}
        run: |
          dist="convey-$TAG-macos-universal"
          mkdir -p "$dist"
          cp "$BIN/convey" "$BIN/convey-app" "$dist"/
          # Ship the ConveyCore resource bundle (vendored turndown/marked/mermaid).
          # Without it the binary crashes: "unable to find bundle Convey_ConveyCore".
          cp -R "$BIN/Convey_ConveyCore.bundle" "$dist"/
          cp README.md LICENSE "$dist"/
          tar -czf "$dist.tar.gz" "$dist"
          shasum -a 256 "$dist.tar.gz" > "$dist.tar.gz.sha256"
          echo "dist=$dist" >> "$GITHUB_OUTPUT"
          echo "archive=$dist.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Verify archive ships the resource bundle
        env:
          DIST: ${{ steps.pkg.outputs.dist }}
          ARCHIVE: ${{ steps.pkg.outputs.archive }}
        run: |
          # The WebKit-backed conversions cannot run on a headless CI runner, so
          # instead of executing a conversion we verify STRUCTURALLY that the
          # resource bundle (the vendored JS that the binary loads at runtime)
          # is present in the archive — this is exactly the packaging regression
          # that previously crashed the released binary.
          listing="$(tar -tzf "$ARCHIVE")"
          echo "$listing"
          required=(
            "$DIST/convey"
            "$DIST/convey-app"
            "$DIST/Convey_ConveyCore.bundle/Contents/Resources/web/runtime.html"
            "$DIST/Convey_ConveyCore.bundle/Contents/Resources/web/bridge.js"
            "$DIST/Convey_ConveyCore.bundle/Contents/Resources/web/turndown.js"
            "$DIST/Convey_ConveyCore.bundle/Contents/Resources/web/marked.min.js"
            "$DIST/Convey_ConveyCore.bundle/Contents/Resources/web/mermaid.min.js"
          )
          for f in "${required[@]}"; do
            printf '%s\n' "$listing" | grep -Fqx "$f" || { echo "MISSING from archive: $f" >&2; exit 1; }
          done
          echo "archive contents verified"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ARCHIVE: ${{ steps.pkg.outputs.archive }}
        run: |
          gh release create "$TAG" \
            --title "Convey $TAG" \
            --generate-notes \
            "$ARCHIVE" "$ARCHIVE.sha256"
