name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Stamp version into the build
        run: |
          printf 'public let conveyVersion = "%s"\n' "${{ steps.version.outputs.value }}" \
            > Sources/ConveyCore/Version.swift

      - name: Build universal release
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Locate products
        id: bin
        run: echo "dir=$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)" >> "$GITHUB_OUTPUT"

      - name: Verify embedded version
        run: |
          got="$("${{ steps.bin.outputs.dir }}/convey" version)"
          echo "convey version -> $got"
          test "$got" = "${{ steps.version.outputs.value }}"

      - name: Verify universal binaries
        run: |
          file "${{ steps.bin.outputs.dir }}/convey" "${{ steps.bin.outputs.dir }}/convey-app"
          lipo -info "${{ steps.bin.outputs.dir }}/convey"

      - name: Package
        id: pkg
        run: |
          dist="convey-${GITHUB_REF_NAME}-macos-universal"
          mkdir -p "$dist"
          cp "${{ steps.bin.outputs.dir }}/convey" "${{ steps.bin.outputs.dir }}/convey-app" "$dist"/
          cp README.md LICENSE "$dist"/
          tar -czf "$dist.tar.gz" "$dist"
          shasum -a 256 "$dist.tar.gz" > "$dist.tar.gz.sha256"
          echo "archive=$dist.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Convey $GITHUB_REF_NAME" \
            --generate-notes \
            "${{ steps.pkg.outputs.archive }}" \
            "${{ steps.pkg.outputs.archive }}.sha256"
